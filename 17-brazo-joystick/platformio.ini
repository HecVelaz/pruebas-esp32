; ESP32-WROOM-32D (ESP32 clásico, 4 MB flash) en una DevKit con USB-serie CH340 (1a86:7523, /dev/ttyUSB0)
; J1, J2 y J3 del brazo movidos con un joystick en una página web (tools/joystick.py hace de puente con el serie).
; Excepción a la configuración estándar de AGENTS.md (que es para la ESP32-S3): otra placa.
[env:brazo]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF

; Drivers de 06 enlazados (no copiados)
lib_deps =
    symlink://../06-motor-36gp555/lib/BTS7960
    symlink://../06-motor-36gp555/lib/EncoderPCNT

; Exploración tras cambiar la manivela de J3 a 95 mm (2026-11-04): sin franja del cuatro barras y J2/J3 con límites de
; ±EXPLORAR_LIM° desde donde arranca el puente, para llevarlas con el motor hasta su final de carrera y ver el sentido.
; Siguen el freno al soltar, el hombre muerto, el final de carrera y el atasco. pio run -e explorar -t upload
[env:explorar]
extends = env:brazo
build_flags = -DEXPLORAR -DEXPLORAR_LIM=150.0f
