<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Teleop 25</title>
<style>
  :root { --fondo:#111; --panel:#1d1f22; --borde:#3a3d42; --txt:#e8e8e8; --tenue:#9aa0a6;
          --azul:#3a7bd5; --naranja:#e08a1e; --verde:#2e7d32; --rojo:#c62828; --gris:#3b4148; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--fondo); color:var(--txt);
               font:13px system-ui, sans-serif; overflow:hidden;
               user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  #girar { display:none; position:fixed; inset:0; background:var(--fondo); z-index:9;
           align-items:center; justify-content:center; text-align:center; font-size:20px; padding:24px; }
  @media (orientation: portrait) { #girar { display:flex; } }
  body { display:flex; flex-direction:column; gap:6px; height:100dvh;
         padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))
                  max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
  #barraSup { display:flex; gap:6px; flex:none; }
  #barraSup button { min-height:40px; font-size:14px; }
  main { flex:1; min-height:0; display:grid; grid-template-columns: 1fr 1.05fr 1.25fr; gap:8px; }
  section { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; min-width:0; min-height:0; }
  h2 { margin:0; font-size:12px; font-weight:600; color:var(--tenue); letter-spacing:.04em; text-transform:uppercase; }
  .pad { --t: min(calc(100dvh - 150px), 27vw); width:var(--t); height:var(--t); border-radius:50%;
         background:var(--panel); border:2px solid var(--borde); position:relative; touch-action:none; flex:none; }
  .pad::before, .pad::after { content:""; position:absolute; background:var(--borde); }
  .pad::before { left:50%; top:10%; bottom:10%; width:1px; } .pad::after { top:50%; left:10%; right:10%; height:1px; }
  .bola { position:absolute; width:34%; height:34%; left:33%; top:33%; border-radius:50%; background:var(--azul);
          box-shadow:0 2px 8px #0008; z-index:1; transition:transform .08s; }
  .activo .bola { transition:none; }
  #padB .bola, #barra .bola { background:var(--naranja); }
  .brazo { display:flex; gap:8px; align-items:center; }
  #barra { width:54px; height: min(calc(100dvh - 150px), 27vw); border-radius:27px; background:var(--panel);
           border:2px solid var(--borde); position:relative; touch-action:none; flex:none; }
  #barra .bola { width:44px; height:44px; left:3px; top:calc(50% - 22px); }
  .etq { position:absolute; font-size:10px; color:var(--tenue); pointer-events:none; }
  .fila { display:flex; gap:5px; width:100%; }
  button { flex:1; min-height:40px; font:600 13px system-ui, sans-serif; border:0; border-radius:9px;
           color:#fff; background:var(--gris); padding:4px 3px; touch-action:manipulation; }
  button:active { filter:brightness(1.35); }
  .verde { background:var(--verde); } .rojo { background:var(--rojo); }
  #parar { flex:1.6; font-size:18px; }
  label { display:flex; gap:6px; align-items:center; width:100%; font-size:12px; color:var(--tenue); }
  input[type=range] { flex:1; min-width:0; }
  .estado { width:100%; background:var(--panel); border-radius:8px; padding:4px 6px;
            font:11px ui-monospace, monospace; line-height:1.3; overflow:hidden; }
  .ok { color:#7bd88f; } .mal { color:#ff6b6b; } .med { color:#f2c14e; }
  #log { flex:1; min-height:0; color:var(--tenue); font-size:10px; }
  #rtt { flex:none; width:auto; align-self:center; white-space:nowrap; }
</style></head>
<body>
<div id="girar">Girá el celular (horizontal)</div>
<div id="barraSup">
  <button class="rojo" id="parar">PARAR</button>
  <button class="verde" id="homing">Homing</button>
  <button id="reposo">Reposo</button>
  <button class="verde" id="armarBase">Armar base</button>
  <button id="desarmarBase">Desarmar</button>
  <button id="rearmar">Rearmar</button>
  <button id="sens">Sensores</button>
  <div class="estado" id="rtt">—</div>
</div>
<main>
  <section>
    <h2>Tracción</h2>
    <div class="pad" id="padA"><div class="bola"></div>
      <span class="etq" style="top:3%;left:40%">avanza</span><span class="etq" style="bottom:3%;left:37%">retrocede</span></div>
    <label>Vel. <input id="velA" type="range" min="10" max="100" value="40"><span id="pctA">40 %</span></label>
  </section>

  <section>
    <div class="estado" id="estBrazo">brazo: esperando…</div>
    <div class="estado" id="estBase">base: esperando…</div>
    <div class="fila"><button id="pzA">Pinza abrir</button><button id="pzC">Pinza cerrar</button></div>
    <div class="fila"><button id="mnA">Muñeca ⟳</button><button id="mn0">Muñeca 0</button><button id="mnB">Muñeca ⟲</button></div>
    <div class="estado" id="log"></div>
  </section>

  <section>
    <h2>Brazo</h2>
    <div class="brazo">
      <div class="pad" id="padB"><div class="bola"></div>
        <span class="etq" style="top:3%;left:38%">J2 sube</span><span class="etq" style="bottom:3%;left:38%">J2 baja</span>
        <span class="etq" style="left:3%;top:46%">J1 ←</span><span class="etq" style="right:3%;top:46%">J1 →</span></div>
      <div id="barra"><div class="bola"></div>
        <span class="etq" style="top:3%;left:8px">J3 ↑</span><span class="etq" style="bottom:3%;left:8px">J3 ↓</span></div>
    </div>
    <label>Vel. <input id="velB" type="range" min="10" max="100" value="60"><span id="pctB">60 %</span></label>
  </section>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const ESTADOS = ["suelta", "yendo", "llegó", "firme", "frenada", "mov", "homing"];

// Un joystick (pad 2D o barra 1D) con su propio dedo (pointerId): se pueden usar los dos a la vez
function joystick(el, ejes) {
  const bola = el.querySelector(".bola");
  const s = { x: 0, y: 0, activo: false, id: null };
  function mover(e) {
    const r = el.getBoundingClientRect();
    const radio = ejes === 2 ? r.width / 2 : r.height / 2;
    let dx = ejes === 2 ? (e.clientX - r.left - r.width / 2) / radio : 0;
    let dy = (e.clientY - r.top - r.height / 2) / radio;
    const m = Math.hypot(dx, dy);
    if (m > 1) { dx /= m; dy /= m; }
    const zona = 0.12;  // zona muerta en el centro
    s.x = Math.abs(dx) < zona ? 0 : dx;
    s.y = Math.abs(dy) < zona ? 0 : -dy;  // arriba = +
    bola.style.transform = `translate(${dx * radio * (ejes === 2 ? 0.66 : 0.8)}px, ${dy * radio * (ejes === 2 ? 0.66 : 0.8)}px)`;
  }
  el.addEventListener("pointerdown", e => {
    if (s.id !== null) return;
    s.id = e.pointerId; s.activo = true; el.classList.add("activo");
    el.setPointerCapture(e.pointerId); mover(e); e.preventDefault();
  });
  el.addEventListener("pointermove", e => { if (e.pointerId === s.id) mover(e); });
  const soltar = e => {
    if (e.pointerId !== s.id) return;
    s.id = null; s.activo = false; s.x = s.y = 0; el.classList.remove("activo"); bola.style.transform = "";
  };
  el.addEventListener("pointerup", soltar);
  el.addEventListener("pointercancel", soltar);
  return s;
}

const base = joystick($("padA"), 2), brazo = joystick($("padB"), 2), barra = joystick($("barra"), 1);
for (const [r, t] of [["velA", "pctA"], ["velB", "pctB"]])
  $(r).addEventListener("input", () => $(t).textContent = $(r).value + " %");

let rtt = null;
// Nunca apilar pedidos (con 10 por segundo y una red lenta se juntaban 20 s de cola): por ruta, uno en vuelo; si
// llega otro mientras tanto, queda solo el último y sale apenas vuelve el anterior (los ceros al soltar no se pierden)
const enVuelo = {}, pendiente = {};
async function post(ruta, datos) {
  if (enVuelo[ruta]) { pendiente[ruta] = datos; return; }
  enVuelo[ruta] = true;
  try {
    const r = await fetch(ruta, { method: "POST", body: JSON.stringify(datos), cache: "no-store" });
    return r.ok;
  } catch (e) { return false; }
  finally {
    enVuelo[ruta] = false;
    if (pendiente[ruta] !== undefined) { const d = pendiente[ruta]; delete pendiente[ruta]; post(ruta, d); }
  }
}

// Cada 100 ms mientras se toca; al soltar, tres veces cero (por si se pierde uno)
let ceroBase = 0, ceroBrazo = 0;
setInterval(() => {
  if (base.activo) {
    ceroBase = 3;
    // Recto fácil: si el dedo va casi derecho (desvío < 20 % del avance), sin giro
    const w = Math.abs(base.x) < 0.2 * Math.abs(base.y) ? 0 : -base.x;
    post("/base", { v: base.y, w, f: $("velA").value / 100 });
  }
  else if (ceroBase > 0) { ceroBase--; post("/base", { v: 0, w: 0 }); }
  const fb = $("velB").value / 100;
  if (brazo.activo || barra.activo) {
    ceroBrazo = 3;
    // J1: derecha = +. J2: arriba = sube (q2 baja). J3: arriba = sube el antebrazo (q3 baja)
    post("/jv", { a: [brazo.x * fb, -brazo.y * fb, -barra.y * fb] });
  } else if (ceroBrazo > 0) { ceroBrazo--; post("/jv", { a: [0, 0, 0] }); }
}, 100);

// Los botones no se juntan (cada uno cuenta): van directo, sin la cola de los joysticks
const cmd = (dest, c) => fetch("/cmd", { method: "POST", body: JSON.stringify({ dest, c }), cache: "no-store" }).catch(() => {});
$("parar").onclick = () => { cmd("base", "s"); cmd("brazo", "s"); };
$("armarBase").onclick = () => cmd("base", "armar");
$("desarmarBase").onclick = () => cmd("base", "desarmar");
$("rearmar").onclick = () => cmd("base", "r");
let verSens = 0;
$("sens").onclick = () => { verSens = Date.now(); cmd("base", "sens"); };
$("pzA").onclick = () => cmd("brazo", "pz a");
$("pzC").onclick = () => cmd("brazo", "pz c");
$("mnA").onclick = () => cmd("brazo", "mn a");
$("mn0").onclick = () => cmd("brazo", "mn 0");
$("mnB").onclick = () => cmd("brazo", "mn b");
$("homing").onclick = () => { if (confirm("Homing: brazo abajo y recogido, mano cerca. ¿Seguir?")) cmd("brazo", "h"); };
$("reposo").onclick = () => cmd("brazo", "mv 3 17 4");

function parseEstado(t) {
  const d = {};
  for (const par of t.split(";")) { const [k, v] = par.split("="); if (k) d[k] = v; }
  return d;
}
const clase = ok => ok ? "ok" : "mal";

async function refrescar() {
  try {
    const t0 = performance.now();
    const e = await (await fetch("/estado", { cache: "no-store" })).json();
    rtt = performance.now() - t0;  // la latencia también sin tocar nada (antes solo con los POST)
    if (e.brazo_vivo) {
      const d = parseEstado(e.brazo), q = (d.q || "").split(","), es = (d.e || "").split(",");
      const cero = d.c === "111";
      $("estBrazo").innerHTML =
        `<span class="ok">brazo ●</span> ${cero ? "" : '<span class="mal">SIN CERO: tocar Homing</span>'}<br>` +
        q.map((v, i) => `J${i + 1} ${(+v).toFixed(1)}° ${ESTADOS[+es[i]] || "?"}`).join(" · ") +
        `<br>pinza ${d.pz === "-1" ? "suelta" : d.pz + " µs"} · muñeca ${d.mn === "-1" ? "suelta" : d.mn + " µs"}`;
    } else $("estBrazo").innerHTML = '<span class="mal">brazo sin datos</span> (¿agente o firmware ros?)';

    let b = e.base_vivo ? '<span class="ok">base ●</span> ' : '<span class="mal">base sin datos</span> ';
    // /base/estado: "<ARMADA|DESARMADA> modo=… seguridad=<ok|VUELCO|sin comandos|…>[ no_avanza…] imu=…"
    const m = /seguridad=(.*?) imu=/.exec(e.base || ""), arm = /^(DESARMADA|ARMADA)/.exec(e.base || "");
    if (m) b += `seg. <span class="${m[1] === "ok" ? "ok" : "med"}">${m[1]}</span> `;
    if (arm) b += arm[1].toLowerCase();
    if (e.bumpers !== null) {
      const n = ["fr", "iz", "de"].map((x, i) => (e.bumpers >> i) & 1 ? `<span class="mal">${x}</span>` : x);
      b += `<br>bumpers ${n.join(" ")}`;
    }
    const r = e.rango || {};
    if (Object.keys(r).length)
      b += `<br>dist ${["izq", "frente", "der"].map(k => r[k] == null ? "–" : typeof r[k] === "string" ? (r[k] === "sin eco" ? `<span class="mal">${r[k]}</span>` : r[k]) : (r[k] * 100).toFixed(0) + " cm").join(" / ")}`;
    if (e.imu) b += `<br>roll ${e.imu[0]}° pitch ${e.imu[1]}°`;
    if (e.bateria !== null) b += ` · bat ${e.bateria} V`;
    $("estBase").innerHTML = b;
    const lineas = Date.now() - verSens < 15000 ? e.base_resp.slice(-12)  // después de "Sensores", lo de la base
      : [...e.brazo_resp.slice(-4), ...e.base_resp.slice(-3)];
    $("log").innerHTML = lineas
      .map(l => l.replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" })[c])).join("<br>");
    $("rtt").textContent = rtt == null ? "sin conexión con la Pi" : `latencia ${rtt.toFixed(0)} ms`;
  } catch (err) { rtt = null; $("rtt").textContent = "sin conexión con la Pi"; }
}
async function bucleEstado() { await refrescar(); setTimeout(bucleEstado, 300); }
bucleEstado();
</script>
</body></html>
