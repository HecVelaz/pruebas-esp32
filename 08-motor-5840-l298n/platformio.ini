; ESP32-WROOM-32D (ESP32 clásico, 4 MB flash) en una DevKit con USB-serie CH340 (1a86:7523, /dev/ttyUSB0)
; Prueba: motor 5840-31ZY (sin fin, 12 V, 160 rpm) con driver L298N y encoder externo 1000 PPR, lazo abierto.
; Excepción a la configuración estándar de AGENTS.md (que es para la ESP32-S3): otra placa.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; Sin puerto fijo: PlatformIO detecta el CH340. Para forzarlo: --upload-port /dev/ttyUSB0
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF

; Encoder por PCNT: el driver de 06 enlazado (funciona igual en el ESP32 clásico)
lib_deps =
    symlink://../06-motor-36gp555/lib/EncoderPCNT
