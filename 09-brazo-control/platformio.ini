; ESP32-WROOM-32D (ESP32 clásico, 4 MB flash) en una DevKit con USB-serie CH340 (1a86:7523, /dev/ttyUSB0)
; Firmware del brazo: J1 (36GP-555 + IBT-2), J2/J3 (5840-31ZY + L298N) y pinza (2 servos), lazo cerrado.
; Excepción a la configuración estándar de AGENTS.md (que es para la ESP32-S3): otra placa, como 08.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
; Drivers de 06 y 08 enlazados (no copiados). lib/ControlArticulacion es propia de este proyecto.
lib_deps =
    symlink://../06-motor-36gp555/lib/BTS7960
    symlink://../06-motor-36gp555/lib/EncoderPCNT
    symlink://../08-motor-5840-l298n/lib/L298N

; Pruebas del control en la PC, sin placa: pio test -e native
[env:native]
platform = native
test_build_src = no
build_flags = -std=gnu++17
lib_compat_mode = off
lib_ignore = BTS7960, EncoderPCNT, L298N
