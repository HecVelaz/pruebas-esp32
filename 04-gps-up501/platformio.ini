; ESP32-S3-WROOM-1 N16R8 (16 MB flash, 8 MB PSRAM octal)
; Prueba: GPS Fastrax UP501 por UART1 (NMEA, driver propio en lib/UP501 sobre TinyGPSPlus)
[platformio]
; Sin esto, pio run -t upload flashea los dos entornos seguidos y la placa queda con el último
default_envs = esp32s3

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200

; lib/UP501 depende de TinyGPSPlus (declarado también en su library.json)
lib_deps =
    mikalhart/TinyGPSPlus@^1.1.0

[env:esp32s3]
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial por el USB nativo (el que aparece como /dev/ttyACM0)
    -DARDUINO_USB_CDC_ON_BOOT=1

; Alternativa: Serial por UART0 (GPIO43/44) y el conector USB del CH343 (1a86:55d3).
; Evita los resets del USB nativo, que a veces dejan la S3 en modo descarga.
; Sin puerto fijo: PlatformIO lo detecta (el CH343 es /dev/ttyACM0 o /dev/ttyACM1 si el USB nativo también
; está conectado). Para forzarlo: --upload-port /dev/ttyACMx.
; pio run -e uart -t upload -t monitor
[env:uart]
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
