; ESP32 clásico (ESP32-D0WD-V3, 4 MB flash) en una DevKit "ESP32S" con USB-serie CP2102 (10c4:ea60, /dev/ttyUSB0)
; Prueba del servo de la muñeca: mismo programa que 21-servo-mg996r-pinza, con el driver ServoPWM enlazado.
; Excepción a la configuración estándar (que es para la ESP32-S3): otra placa.
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
; Sin puerto fijo: PlatformIO detecta el CP2102. Si también está la WROOM (CH340): --upload-port /dev/ttyUSBx
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
lib_deps = symlink://../21-servo-mg996r-pinza/lib/ServoPWM
