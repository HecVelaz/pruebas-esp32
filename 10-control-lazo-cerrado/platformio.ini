; ESP32-WROOM-32D (ESP32 clásico, 4 MB flash) en una DevKit con USB-serie CH340 (1a86:7523, /dev/ttyUSB0)
; Lazo cerrado de J1 (36GP-555 + IBT-2), J2 (5840-31ZY + L298N) y J3 (5840-31ZY + IBT-2) del brazo, con los pines del robot.
; Excepción a la configuración estándar de AGENTS.md (que es para la ESP32-S3): otra placa.
; Un entorno por articulación: -e j1 (base), -e j2 (hombro) o -e j3 (codo). Los parámetros de cada una están en include/config.h.
[platformio]
default_envs = j3

[env]
platform = espressif32
board = esp32dev
framework = arduino
; Sin puerto fijo: PlatformIO detecta el CH340. Para forzarlo: --upload-port /dev/ttyUSB0
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF

; Drivers de 06 y 08 enlazados (no copiados)
lib_deps =
    symlink://../06-motor-36gp555/lib/BTS7960
    symlink://../06-motor-36gp555/lib/EncoderPCNT
    symlink://../08-motor-5840-l298n/lib/L298N

[env:j1]

[env:j2]
build_flags = -DARTICULACION_J2 -DARTICULACION_L298N

; J2 en el IBT-2 y los pines de J3 (RPWM 16, LPWM 17, EN 13, encoder 18/19), con J3 desconectado (2026-10-03)
[env:j2ibt]
build_flags = -DARTICULACION_J2 -DJ2_IBT2

; J3 con su propio IBT-2 (16/17/13) y su encoder (18/19): conexiones_j3.html
[env:j3]
build_flags = -DARTICULACION_J3
