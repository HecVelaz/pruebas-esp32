; ESP32-WROOM-32D (ESP32 clásico, 4 MB flash) en una DevKit con USB-serie CH340 (1a86:7523, /dev/ttyUSB0)
; Lazo cerrado de J1, J2 y J3 del brazo, cada una con su IBT-2 y con los pines del robot (conexionado v0.4: EN común en 23).
; Excepción a la configuración estándar de AGENTS.md (que es para la ESP32-S3): otra placa.
; Un entorno por articulación: -e j1 (base), -e j2 (hombro) o -e j3 (codo). Los parámetros de cada una están en include/config.h.
[platformio]
default_envs = j3

[env]
platform = espressif32
board = esp32dev
framework = arduino
; Sin puerto fijo: PlatformIO detecta el CH340. Para forzarlo: --upload-port /dev/ttyUSB0
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF

; Drivers de 06 enlazados (no copiados)
lib_deps =
    symlink://../06-motor-36gp555/lib/BTS7960
    symlink://../06-motor-36gp555/lib/EncoderPCNT

[env:j1]

; J2 con su IBT-2 (RPWM 25, LPWM 26, EN 23) y su encoder (32/33). Hasta el 2026-10-10 había -e j2 (L298N) y
; -e j2ibt (IBT-2 en los pines de J3): ver git log
[env:j2]
build_flags = -DARTICULACION_J2

; Prueba aislada (2026-10-10): el motor de J1 (36GP-555 de 160 rpm, 50:1) en el hombro, cableado como J2, para ver si
; puede levantar el brazo
[env:j2_160]
build_flags = -DARTICULACION_J2 -DJ2_MOTOR_160RPM

; Prueba: el motor de J2 (36-555 58 rpm, configuración de J2) conectado en el IBT-2 y el encoder de J1
; (RPWM 21, LPWM 22, EN 23, encoder 34/35)
[env:j2_en_j1]
build_flags = -DARTICULACION_J2 -DJ2_EN_PINES_J1

; Prueba: el motor de J1 (36GP-555 160 rpm, 50:1) en el hombro como J2, cableado en el IBT-2 y el encoder de J1
[env:j2_160_en_j1]
build_flags = -DARTICULACION_J2 -DJ2_MOTOR_160RPM -DJ2_EN_PINES_J1

; J3 con su IBT-2 (RPWM 16, LPWM 17, EN 23) y su encoder (18/19)
[env:j3]
build_flags = -DARTICULACION_J3
