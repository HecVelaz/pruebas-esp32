; ESP32-WROOM-32D (DevKit con CH340) con el conexionado del robot (v0.5; finales de carrera de J2/J3 cruzados).
; 20 · J1, J2 y J3 con el MISMO controlador (lib/Articulacion) en un solo lazo no bloqueante a 100 Hz.
; Excepción a la configuración estándar (que es para la ESP32-S3): otra placa. Parámetros en include/config.h.
[platformio]
default_envs = brazo

[env:brazo]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
; Drivers de 06 enlazados (no copiados); lib/Articulacion es de esta carpeta
lib_deps =
    symlink://../06-motor-36gp555/lib/BTS7960
    symlink://../06-motor-36gp555/lib/EncoderPCNT
    symlink://../21-servo-mg996r-pinza/lib/ServoPWM

; Con micro-ROS (2026-11-11, para el teleop de 25-teleop-pi): mismo firmware, los comandos llegan por /brazo/comando y
; el estado sale por /brazo/estado (include/capa_ros.h). El USB es del agente: sin monitor serial.
;   pio run -e ros            (la primera vez arma micro-ROS Jazzy: varios minutos)
;   en la Pi: ros2 run micro_ros_agent micro_ros_agent serial --dev /dev/ttyUSB0
; EnlaceMicroRos y el colcon.meta son los del firmware del robot (repo recolector_de_frutas, al lado de este).
[env:ros]
extends = env:brazo
board_microros_distro = jazzy
board_microros_transport = serial
board_microros_user_meta = ../../recolector_de_frutas/firmware/brazo/microros.meta
build_flags = -DUSAR_MICROROS
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    ${env:brazo.lib_deps}
    symlink://../../recolector_de_frutas/firmware/lib/EnlaceMicroRos
