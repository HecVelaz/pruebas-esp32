; ESP32-WROOM-32D (DevKit con CH340) con el conexionado del robot (v0.5; finales de carrera de J2/J3 cruzados).
; 20 · J1, J2 y J3 con el MISMO controlador (lib/Articulacion) en un solo lazo no bloqueante a 100 Hz.
; Excepción a la configuración estándar (que es para la ESP32-S3): otra placa. Parámetros en include/config.h.
[env:brazo]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
; Drivers de 06 enlazados (no copiados); lib/Articulacion es de esta carpeta
lib_deps =
    symlink://../06-motor-36gp555/lib/BTS7960
    symlink://../06-motor-36gp555/lib/EncoderPCNT
    symlink://../21-servo-mg996r-pinza/lib/ServoPWM
