; ESP32-S3-WROOM-1 N16R8 (16 MB flash, 8 MB PSRAM octal)
; Prueba: motor 36GP-555 + IBT-2 (BTS7960), rampa de PWM de 0 a 100 % que termina al completar N vueltas
; de salida (lazo abierto, con o sin carga). Mismo cableado que 06-motor-36gp555.
[platformio]
default_envs = esp32s3

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF

; Drivers de 06 enlazados, no copiados: un cambio allá afecta a este proyecto
lib_deps =
    symlink://../06-motor-36gp555/lib/BTS7960
    symlink://../06-motor-36gp555/lib/EncoderPCNT

[env:esp32s3]
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; Alternativa por el conector del CH343: pio run -e uart -t upload -t monitor
[env:uart]
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
