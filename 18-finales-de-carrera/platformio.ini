; ESP32-WROOM-32D (ESP32 clásico, 4 MB flash) en una DevKit con USB-serie CH340 (1a86:7523, /dev/ttyUSB0)
; Prueba de los tres finales de carrera del brazo (J1, J2, J3) con el conexionado v0.5 del robot. No mueve motores.
; Excepción a la configuración estándar de AGENTS.md (que es para la ESP32-S3): otra placa.
[env:wroom]
platform = espressif32
board = esp32dev
framework = arduino
; Sin puerto fijo: PlatformIO detecta el CH340. Para forzarlo: --upload-port /dev/ttyUSB0
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
