; ESP32-S3-WROOM-1 N16R8 (16 MB flash, 8 MB PSRAM octal)
; Prueba: IMU MPU-9250/6500 publicado en ROS 2 Jazzy con micro-ROS (/imu/data_raw a 50 Hz)
[platformio]
default_envs = serial

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200

board_microros_distro = jazzy

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    ; Driver compartido con 01-imu-mpu9250 (no se copia)
    symlink://../01-imu-mpu9250/lib/MPU9250

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial por el USB nativo (el que aparece como /dev/ttyACM0)
    -DARDUINO_USB_CDC_ON_BOOT=1

; Transporte serial por USB: el micro-ROS Agent usa /dev/ttyACM0
[env:serial]
board_microros_transport = serial

; Transporte WiFi UDP (para más adelante). Requiere include/wifi_config.h (ver wifi_config.example.h)
[env:wifi]
board_microros_transport = wifi
