; ESP32-S3-WROOM-1 N16R8 (16 MB flash, 8 MB PSRAM octal) sobre la placa de expansión Freenove
; Prueba de los tres HC-SR04 de la base (frente · esq. izq. · esq. der.) con los pines de firmware/base. No mueve motores.
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; Puerto por id (MAC de esta S3): no cambia si la placa vuelve como /dev/ttyACM1 tras un RST con el monitor
; abierto. Con otra S3: ls /dev/serial/by-id/, o --upload-port /dev/ttyACM0 y -p /dev/ttyACM0.
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_94:A9:90:30:24:24-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_94:A9:90:30:24:24-if00
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; Mismo programa con el TRIG del sensor derecho en GPIO 40 (reserva) en lugar del 42: pio run -e trig40
[env:trig40]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DUS_TRIG_DER_40

; ECHO del sensor derecho en GPIO 40 en lugar del 13 (TRIG en el 42 de siempre). Al 40 va la SALIDA del divisor
; (lo que hoy va al 13), nunca el ECHO directo del sensor (5 V): pio run -e echo40
[env:echo40]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DUS_ECHO_DER_40
