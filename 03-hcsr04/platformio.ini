; ESP32-S3-WROOM-1 N16R8 (16 MB flash, 8 MB PSRAM octal) sobre la placa de expansión Freenove
; Prueba de los tres HC-SR04 de la base (frente · esq. izq. · esq. der.) con los pines de firmware/base. No mueve motores.
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
