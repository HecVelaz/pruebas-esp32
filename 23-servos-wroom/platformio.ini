; ESP32-WROOM-32D del brazo (HW-394, CH340, /dev/ttyUSB0), con los pines del robot (placa_wroom.html).
; Prueba: pinza (GPIO 4, comandos de 21) y muñeca (GPIO 14, comandos de 22) en la misma placa.
; Excepción a la configuración estándar (que es para la ESP32-S3): otra placa.
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
lib_deps = symlink://../21-servo-mg996r-pinza/lib/ServoPWM
