; ESP32-S3-WROOM-1 N16R8 (16 MB flash, 8 MB PSRAM octal) sobre la placa de expansión Freenove
; Prueba de los tres bumpers de la base (frente · izq. · der.) con los pines de firmware/base. No mueve motores.
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; Puerto por id (MAC de esta S3): no cambia si la placa vuelve como /dev/ttyACM1 tras un RST con el monitor
; abierto. Con otra S3: ls /dev/serial/by-id/, o --upload-port /dev/ttyACM0 y -p /dev/ttyACM0.
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_94:A9:90:30:24:24-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_94:A9:90:30:24:24-if00
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
