; ESP32-C3-MINI-1 (RISC-V, 4 MB flash). Prueba suelta del IBT-2 de J3 con el motor montado en el brazo.
; Excepción a la configuración estándar de notas/FLUJO.md (que es para la ESP32-S3): otra placa.
; Dos entornos según cómo llega el USB a la placa (mirar con lsusb):
;  - c3_usb:  USB nativo del C3 (303a:1001, /dev/ttyACM0): placas "C3 mini/super mini" sin chip USB-serie.
;  - c3_uart: placa con chip USB-serie (CP2102 10c4:ea60 o CH340 1a86:7523, /dev/ttyUSBx). Por defecto: la placa
;    de esta prueba tiene CH340 (ESP32-C3 QFN32 rev 0.3, 4 MB, verificado con esptool el 2026-10-22).
;    Con la WROOM también enchufada hay dos /dev/ttyUSBx: pasar --upload-port y --port.
[platformio]
default_envs = c3_uart

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
; Driver del IBT-2 de 06 enlazado (no copiado). El encoder va con lib/EncoderCuadratura: el C3 no tiene PCNT.
lib_deps =
    symlink://../06-motor-36gp555/lib/BTS7960

[env:c3_usb]
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial sale por el USB nativo

[env:c3_uart]
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0   ; Serial sale por la UART0 (GPIO 20/21) hacia el chip USB-serie
